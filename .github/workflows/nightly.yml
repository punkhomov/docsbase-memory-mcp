name: nightly

on:
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins nightly for local development; CI validates the
  # MSRV toolchain explicitly (the env var overrides the file).
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  soak-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOAK_SECS: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Offline guarantee (SC-8, NFR-5)
        run: cargo test --locked --test offline -- --nocapture
      - name: Platform seam invariant (ADR-9)
        run: cargo test --locked --test platform_boundary
      - name: Performance budgets (NFR-1, SC-7)
        run: cargo test --locked --release --test perf_budget -- --nocapture
      - name: Soak, 3 agents + watcher, 1 hour (SC-5)
        run: cargo test --locked --release --test soak -- --ignored --nocapture
      - name: Full release suite
        run: cargo test --locked --release
      - name: Lints
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
