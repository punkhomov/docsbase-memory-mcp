name: nightly

on:
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./.github/actions/new-commits
        with:
          workflow-file: nightly.yml

  release-checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Offline guarantee (SC-8, NFR-5)
        run: cargo test --locked --features cli-full --test offline -- --nocapture
      - name: Platform seam invariant (ADR-9)
        run: cargo test --locked --features cli-full --test platform_boundary
      - name: Build static CLI (NFR-6, ADR-8)
        run: cargo release-static --locked
      - name: Static artifact checks (NFR-2, NFR-6)
        run: |
          cargo test --locked --features cli-full --test artifact -- --nocapture
          python3 .github/scripts/check-cli-capabilities.py target/x86_64-unknown-linux-gnu/release/docsbase
      - name: Performance budgets (NFR-1, SC-7)
        # Single-threaded: the 10k RSS delta is process-wide and must not
        # race allocations from the 50k-chunk search budget (T52 review).
        run: cargo test --locked --features cli-full --release --test perf_budget -- --nocapture --test-threads=1
      - name: Functional release suite (artifact/performance targets are opt-in)
        run: cargo test --locked --features cli-full --release
      - name: Lints
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
          cargo clippy --locked --features cli-full --test perf_budget -- -D warnings
          cargo clippy --locked --features cli-full --test artifact -- -D warnings
