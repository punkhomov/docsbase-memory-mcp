# TEMPORARY #155 APPLICATION T1 HARNESS ONLY. NEVER MERGE INTO MAIN.
# Isolated exact-production-parent execution; normal four-job CI remains unchanged.
name: transport155-application-t1

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact isolated harness commit (40 hex characters)
        required: true
        type: string

      production_test_revision:
        description: Exact source and regression-test parent commit
        required: true
        type: string
      production_test_tree:
        description: Exact source and regression-test parent tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transport155-t1-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  windows-application-t1:
    if: github.ref == 'refs/heads/experiment/windows-owned-transport155-t1'
    # GitHub-hosted Windows jobs use a fresh disposable VM. No self-hosted runner
    # is permitted. The job timeout/disposal is independent of all probe processes.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Establish exact ref and disposable-host provenance
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          PRODUCTION_TEST_REVISION: ${{ inputs.production_test_revision }}
          PRODUCTION_TEST_TREE: ${{ inputs.production_test_tree }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target/transport155-t1 | Out-Null
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_REVISION -cne '${{ github.sha }}') {
            throw 'Dispatch revision is not the exact static-reviewed commit'
          }
          foreach ($value in @($env:PRODUCTION_TEST_REVISION, $env:PRODUCTION_TEST_TREE)) {
            if ($value -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source/test identity' }
          }
          $parent = (git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -cne $env:PRODUCTION_TEST_REVISION) { throw 'Harness parent mismatch' }
          $sourceTree = (git rev-parse "$($env:PRODUCTION_TEST_REVISION)^{tree}").Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceTree -cne $env:PRODUCTION_TEST_TREE) { throw 'Source/test tree mismatch' }
          git diff --exit-code $env:PRODUCTION_TEST_REVISION HEAD -- . ':(exclude).github/workflows/ci.yml'
          if ($LASTEXITCODE -ne 0) { throw 'Harness changes functional source outside its temporary workflow' }
          if ('${{ runner.environment }}' -ne 'github-hosted') { throw 'Disposable hosted VM required' }
          $os = Get-CimInstance Win32_OperatingSystem
          @{
            schema = 1; revision = '${{ github.sha }}'; production_test_revision = $parent; production_test_tree = $sourceTree; ref = '${{ github.ref }}'
            run_id = '${{ github.run_id }}'; run_attempt = '${{ github.run_attempt }}'
            runner_environment = '${{ runner.environment }}'; runner_os = '${{ runner.os }}'
            image_os = $env:ImageOS; image_version = $env:ImageVersion
            windows_caption = $os.Caption; windows_version = $os.Version; windows_build = $os.BuildNumber
            architecture = $env:PROCESSOR_ARCHITECTURE
            job_timeout_minutes = 60; external_probe_watchdog_ms = 180000
            disposal_contract = 'GitHub-hosted fresh VM per job; job timeout then runner disposal'
          } | ConvertTo-Json | Set-Content -Encoding utf8 target/transport155-t1/host.json
          "PROBE_WINDOWS_BUILD=$($os.Caption) $($os.Version) build $($os.BuildNumber)" >> $env:GITHUB_ENV
          "PROBE_GIT_REVISION=${{ github.sha }}" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Prepare locked assets and Node client with repository cooldown policy
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm run audit
          pnpm --dir web build
          pnpm --dir packages/client build
          pnpm --dir examples/website-search build
          node --version > target/transport155-t1/node-version.txt
          pnpm --version > target/transport155-t1/pnpm-version.txt
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: transport155-app-t1-rust-1.100.0
          # Never restore old experiment evidence from a target directory.
          cache-targets: false
      - name: Compile the actual application library regression target
        timeout-minutes: 45
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc -Vv | Set-Content target/transport155-t1/rustc.txt
          cargo -Vv | Set-Content target/transport155-t1/cargo.txt
          cargo test --locked --features cli-full --lib --no-run --message-format=json 1> target/transport155-t1/build.jsonl 2> target/transport155-t1/build.stderr.log
          if ($LASTEXITCODE -ne 0) { throw "Application compilation failed: $LASTEXITCODE" }
          $artifacts = @(Get-Content target/transport155-t1/build.jsonl | ForEach-Object {
            $item = $_ | ConvertFrom-Json
            if ($item.reason -eq 'compiler-artifact' -and $item.target.name -eq 'docsbase_memory' -and $item.target.kind -contains 'lib' -and $item.executable) { $item.executable }
          })
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one actual application library test executable' }
          $artifacts[0] | Set-Content target/transport155-t1/executable.txt
          Get-FileHash -Algorithm SHA256 $artifacts[0] | ConvertTo-Json | Set-Content target/transport155-t1/executable-sha256.json
      - name: Run the one application regression once under an independent process watchdog
        timeout-minutes: 5
        shell: pwsh
        env:
          DOCSBASE_TRANSPORT155_DISPOSABLE_HOST: github-hosted-windows
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOCSBASE_TRANSPORT155_EVIDENCE_DIR = Join-Path $PWD 'target/transport155-t1/cases'
          New-Item -ItemType Directory -Force $env:DOCSBASE_TRANSPORT155_EVIDENCE_DIR | Out-Null
          $executable = (Get-Content target/transport155-t1/executable.txt -Raw).Trim()
          $watchdogFile = Join-Path $PWD 'target/transport155-t1/external-watchdog.jsonl'
          function Record-Watchdog($kind, $data) {
            $line = @{schema=1; kind=$kind; utc=[DateTime]::UtcNow.ToString('o'); data=$data} | ConvertTo-Json -Compress
            $stream = [System.IO.FileStream]::new($watchdogFile, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
            try {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($line + "`n")
              $stream.Write($bytes, 0, $bytes.Length)
              $stream.Flush($true)
            } finally { $stream.Dispose() }
            Write-Host $line
            [Console]::Out.Flush()
          }
          $testName = 'daemon::server::windows_transport_tests::stalled_get_doc_retains_original_connection_until_native_retirement'
          & $executable --exact $testName --list --format terse 1> target/transport155-t1/selected-tests.txt 2> target/transport155-t1/selected-tests.stderr.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test inventory failed' }
          $selected = @(Get-Content target/transport155-t1/selected-tests.txt | Where-Object { $_ -eq "${testName}: test" })
          if ($selected.Count -ne 1) { throw 'Expected exactly one native application regression test, never zero-selected' }
          Record-Watchdog 'SupervisorLaunch' @{executable=$executable; deadline_ms=180000}
          $process = Start-Process -FilePath $executable -ArgumentList @('--exact',$testName,'--nocapture','--test-threads=1') -PassThru -NoNewWindow -RedirectStandardOutput target/transport155-t1/supervisor.stdout.log -RedirectStandardError target/transport155-t1/supervisor.stderr.log
          Record-Watchdog 'SupervisorStarted' @{pid=$process.Id}
          if (-not $process.WaitForExit(180000)) {
            Record-Watchdog 'ExternalWatchdogExpired' @{failure=$true; candidate_missing_is_inconclusive=$true}
            # Only the owned supervisor is targeted, once. Killing it is not proof
            # its child or pending native I/O retired; VM disposal remains required.
            try { $process.Kill(); Record-Watchdog 'SupervisorKillRequested' @{pid=$process.Id} }
            catch { Record-Watchdog 'SupervisorKillError' @{message=$_.Exception.Message} }
            $reaped = $process.WaitForExit(5000)
            Record-Watchdog 'SupervisorReap' @{signaled=$reaped; failure=$true}
            throw 'Application regression external watchdog expired; stop, retain evidence, dispose VM'
          }
          Record-Watchdog 'SupervisorExited' @{exit_code=$process.ExitCode}
          if ($process.ExitCode -ne 0) { throw "Application regression failed/inconclusive: $($process.ExitCode)" }
      - name: Preserve raw evidence even on compile, probe or cleanup failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport155-t1-${{ github.sha }}-${{ github.run_attempt }}
          path: target/transport155-t1/
          if-no-files-found: error
          retention-days: 14
