name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins nightly for local development; CI validates the
  # MSRV toolchain explicitly (the env var overrides the file).
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Repo hygiene (README/docs/installers/version)
        run: |
          set -e
          test -f README.md
          test -f README.ru.md
          test -f CHANGELOG.md
          test -f install.sh
          test -f install.ps1
          test -f docs/INSTALL.md
          test -f docs/QUICKSTART.md
          test -f docs/CONFIG.md
          test -f docs/MCP.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ci.md
          sh -n install.sh
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          grep -q "\[$VERSION\]" CHANGELOG.md || (echo "::error::CHANGELOG.md has no [$VERSION] entry" && exit 1)
          grep -q 'README.ru.md' README.md
          grep -q 'README.md' README.ru.md
          echo "docs gate OK (version $VERSION)"
      - name: CI observer regression checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCSBASE_BENCH_LATENCY_SLACK: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare embedded Web assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run check --prefix web
          npm run test:unit --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
      - name: Initialize test diagnostics
        shell: bash
        run: |
          # Never publish observations restored from an earlier cache entry.
          rm -rf target/ci-observations target/cargo-timings
          echo "CI_RUST_CACHE_HIT=${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
      - name: Lean dependency boundary (NFR-1, SC-1)
        run: |
          mkdir -p target/ci-observations
          # Separate the producer so a failed cargo tree cannot look offline.
          cargo tree --locked --color never -e normal > target/ci-observations/lean-dependency-tree.txt
          if [ ! -s target/ci-observations/lean-dependency-tree.txt ]; then
            echo "::error::cargo tree returned an empty dependency graph"
            exit 1
          fi
          if grep -wE 'axum|ts-rs|fastembed|ort|tokenizers|hf-hub|image|native-tls|ureq|reqwest' target/ci-observations/lean-dependency-tree.txt; then
            echo "::error::forbidden crate leaked into the default build (NFR-1)"
            exit 1
          fi
          echo "default build has no network/ML crates"
      - name: Lints (Linux)
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
          # Opt-in test targets are not selected by --all-targets.
          cargo clippy --locked --features cli-full --test perf_budget -- -D warnings
          cargo clippy --locked --features cli-full --test artifact -- -D warnings
      - name: Prepare functional suite (Linux)
        run: python3 .github/scripts/observe-tests.py --suite cli-full --phase prepare -- cargo test --locked --features cli-full --no-run --timings
      - name: Inventory functional suite (Linux)
        run: python3 .github/scripts/observe-tests.py --suite cli-full --phase inventory -- cargo test --locked --features cli-full -- --list
      - name: Functional suite (Linux)
        run: python3 .github/scripts/observe-tests.py --suite cli-full --phase execute -- cargo test --locked --features cli-full

      - name: Browser acceptance (real daemon)
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/
      - name: Full CLI provider capabilities (offline)
        run: python3 .github/scripts/check-cli-capabilities.py target/debug/docsbase
      - name: Embedded Web artifact smoke
        run: python3 .github/scripts/check-web-artifact.py target/debug/docsbase
      - name: Build static CLI (NFR-6, ADR-8)
        run: python3 .github/scripts/observe-tests.py --suite static-artifact-build --phase prepare -- cargo release-static --locked --timings
      - name: Static artifact checks (NFR-2, NFR-6)
        run: |
          python3 .github/scripts/observe-tests.py --suite static-artifact --phase prepare -- cargo test --locked --features cli-full --test artifact --no-run --timings
          python3 .github/scripts/observe-tests.py --suite static-artifact --phase inventory -- cargo test --locked --features cli-full --test artifact -- --list
          python3 .github/scripts/observe-tests.py --suite static-artifact --phase execute -- cargo test --locked --features cli-full --test artifact -- --nocapture
      - name: Static CLI provider capabilities (offline)
        run: python3 .github/scripts/check-cli-capabilities.py target/x86_64-unknown-linux-gnu/release/docsbase
      - name: Embedded Web artifact smoke
        run: python3 .github/scripts/check-web-artifact.py target/x86_64-unknown-linux-gnu/release/docsbase
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            target/ci-observations/
            target/cargo-timings/

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare embedded Web assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run check --prefix web
          npm run test:unit --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
      - name: Initialize test diagnostics
        shell: bash
        run: |
          # Never publish observations restored from an earlier cache entry.
          rm -rf target/ci-observations target/cargo-timings
          echo "CI_RUST_CACHE_HIT=${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
      - name: Lints (ADR-10)
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
      - name: Prepare functional suite (Windows)
        run: python .github/scripts/observe-tests.py --suite cli-full --phase prepare -- cargo test --locked --features cli-full --no-run --timings
      - name: Inventory functional suite (Windows)
        run: python .github/scripts/observe-tests.py --suite cli-full --phase inventory -- cargo test --locked --features cli-full -- --list
      - name: Functional suite (daemon + CLI + MCP, ADR-10)
        run: python .github/scripts/observe-tests.py --suite cli-full --phase execute -- cargo test --locked --features cli-full

      - name: Full CLI provider capabilities (offline)
        run: python .github/scripts/check-cli-capabilities.py target/debug/docsbase.exe
      - name: Embedded Web artifact smoke
        run: python .github/scripts/check-web-artifact.py target/debug/docsbase.exe
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            target/ci-observations/
            target/cargo-timings/

  macos:
    # Native shipped CLI profile (macOS aarch64).
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Documented floor (requirements.md): enforce it in the build.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare embedded Web assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run check --prefix web
          npm run test:unit --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
      - name: Initialize test diagnostics
        shell: bash
        run: |
          # Never publish observations restored from an earlier cache entry.
          rm -rf target/ci-observations target/cargo-timings
          echo "CI_RUST_CACHE_HIT=${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
      - name: Lints (macOS)
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
      - name: Prepare functional suite (macOS)
        run: python3 .github/scripts/observe-tests.py --suite cli-full --phase prepare -- cargo test --locked --features cli-full --no-run --timings
      - name: Inventory functional suite (macOS)
        run: python3 .github/scripts/observe-tests.py --suite cli-full --phase inventory -- cargo test --locked --features cli-full -- --list
      - name: Functional suite (macOS, aarch64)
        run: python3 .github/scripts/observe-tests.py --suite cli-full --phase execute -- cargo test --locked --features cli-full
      - name: Full CLI provider capabilities (offline)
        run: python3 .github/scripts/check-cli-capabilities.py target/debug/docsbase
      - name: Embedded Web artifact smoke
        run: python3 .github/scripts/check-web-artifact.py target/debug/docsbase
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            target/ci-observations/
            target/cargo-timings/
