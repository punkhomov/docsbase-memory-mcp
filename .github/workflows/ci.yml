# TEMPORARY #155 PROBE BRANCH ONLY. NEVER MERGE THIS WORKFLOW INTO MAIN.
# Replaces the normal four-job CI only on experiment/windows-transport-retirement-155.
name: transport155-native-probe

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact static-reviewed probe commit (40 hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transport155-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  windows-probe:
    if: github.ref == 'refs/heads/experiment/windows-transport-retirement-155'
    # GitHub-hosted Windows jobs use a fresh disposable VM. No self-hosted runner
    # is permitted. The job timeout/disposal is independent of all probe processes.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Establish exact ref and disposable-host provenance
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target/probe155 | Out-Null
          if ($env:EXPECTED_REVISION -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_REVISION -cne '${{ github.sha }}') {
            throw 'Dispatch revision is not the exact static-reviewed commit'
          }
          if ('${{ runner.environment }}' -ne 'github-hosted') { throw 'Disposable hosted VM required' }
          $os = Get-CimInstance Win32_OperatingSystem
          @{
            schema = 1; revision = '${{ github.sha }}'; ref = '${{ github.ref }}'
            run_id = '${{ github.run_id }}'; run_attempt = '${{ github.run_attempt }}'
            runner_environment = '${{ runner.environment }}'; runner_os = '${{ runner.os }}'
            image_os = $env:ImageOS; image_version = $env:ImageVersion
            windows_caption = $os.Caption; windows_version = $os.Version; windows_build = $os.BuildNumber
            architecture = $env:PROCESSOR_ARCHITECTURE
            job_timeout_minutes = 60; external_probe_watchdog_ms = 180000
            disposal_contract = 'GitHub-hosted fresh VM per job; job timeout then runner disposal'
          } | ConvertTo-Json | Set-Content -Encoding utf8 target/probe155/host.json
          "PROBE_WINDOWS_BUILD=$($os.Caption) $($os.Version) build $($os.BuildNumber)" >> $env:GITHUB_ENV
          "PROBE_GIT_REVISION=${{ github.sha }}" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Prepare locked assets and Node client with repository cooldown policy
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm run audit
          pnpm --dir web build
          pnpm --dir packages/client build
          node --version > target/probe155/node-version.txt
          pnpm --version > target/probe155/pnpm-version.txt
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: transport155-probe-rust-1.100.0
          # Never restore old experiment evidence from a target directory.
          cache-targets: false
      - name: Compile only the Windows characterization target
        timeout-minutes: 45
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc -Vv | Set-Content target/probe155/rustc.txt
          cargo -Vv | Set-Content target/probe155/cargo.txt
          cargo test --locked --features cli-full --test windows_transport_probe --no-run --message-format=json 1> target/probe155/build.jsonl 2> target/probe155/build.stderr.log
          if ($LASTEXITCODE -ne 0) { throw "Probe compilation failed: $LASTEXITCODE" }
          $artifacts = @(Get-Content target/probe155/build.jsonl | ForEach-Object {
            $item = $_ | ConvertFrom-Json
            if ($item.reason -eq 'compiler-artifact' -and $item.target.name -eq 'windows_transport_probe' -and $item.executable) { $item.executable }
          })
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one probe test executable' }
          $artifacts[0] | Set-Content target/probe155/executable.txt
          Get-FileHash -Algorithm SHA256 $artifacts[0] | ConvertTo-Json | Set-Content target/probe155/executable-sha256.json
      - name: Run the four cases once under an independent process watchdog
        timeout-minutes: 5
        shell: pwsh
        env:
          DOCSBASE_155_DISPOSABLE_HOST: github-hosted-windows
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOCSBASE_155_EVIDENCE = Join-Path $PWD 'target/probe155/cases'
          New-Item -ItemType Directory -Force $env:DOCSBASE_155_EVIDENCE | Out-Null
          $executable = (Get-Content target/probe155/executable.txt -Raw).Trim()
          $watchdogFile = Join-Path $PWD 'target/probe155/external-watchdog.jsonl'
          function Record-Watchdog($kind, $data) {
            $line = @{schema=1; kind=$kind; utc=[DateTime]::UtcNow.ToString('o'); data=$data} | ConvertTo-Json -Compress
            $stream = [System.IO.FileStream]::new($watchdogFile, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
            try {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($line + "`n")
              $stream.Write($bytes, 0, $bytes.Length)
              $stream.Flush($true)
            } finally { $stream.Dispose() }
            Write-Host $line
            [Console]::Out.Flush()
          }
          Record-Watchdog 'SupervisorLaunch' @{executable=$executable; deadline_ms=180000}
          $process = Start-Process -FilePath $executable -ArgumentList @('--exact','windows_transport_probe','--nocapture','--test-threads=1') -PassThru -NoNewWindow -RedirectStandardOutput target/probe155/supervisor.stdout.log -RedirectStandardError target/probe155/supervisor.stderr.log
          Record-Watchdog 'SupervisorStarted' @{pid=$process.Id}
          if (-not $process.WaitForExit(180000)) {
            Record-Watchdog 'ExternalWatchdogExpired' @{failure=$true; candidate_missing_is_inconclusive=$true}
            # Only the owned supervisor is targeted, once. Killing it is not proof
            # its child or pending native I/O retired; VM disposal remains required.
            try { $process.Kill(); Record-Watchdog 'SupervisorKillRequested' @{pid=$process.Id} }
            catch { Record-Watchdog 'SupervisorKillError' @{message=$_.Exception.Message} }
            $reaped = $process.WaitForExit(5000)
            Record-Watchdog 'SupervisorReap' @{signaled=$reaped; failure=$true}
            throw 'Native probe external watchdog expired; stop, retain evidence, dispose VM'
          }
          Record-Watchdog 'SupervisorExited' @{exit_code=$process.ExitCode}
          if ($process.ExitCode -ne 0) { throw "Native probe failed/inconclusive: $($process.ExitCode)" }
      - name: Preserve raw evidence even on compile, probe or cleanup failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport155-${{ github.sha }}-${{ github.run_attempt }}
          path: target/probe155/
          if-no-files-found: error
          retention-days: 14
