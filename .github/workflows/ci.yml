name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins nightly for local development; CI validates the
  # MSRV toolchain explicitly (the env var overrides the file).
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Repo hygiene (README/docs/installers/version)
        run: |
          set -e
          test -f README.md
          test -f README.ru.md
          test -f CHANGELOG.md
          test -f install.sh
          test -f install.ps1
          test -f docs/INSTALL.md
          test -f docs/QUICKSTART.md
          test -f docs/CONFIG.md
          test -f docs/MCP.md
          test -f docs/ARCHITECTURE.md
          sh -n install.sh
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          grep -q "\[$VERSION\]" CHANGELOG.md || (echo "::error::CHANGELOG.md has no [$VERSION] entry" && exit 1)
          grep -q 'README.ru.md' README.md
          grep -q 'README.md' README.ru.md
          echo "docs gate OK (version $VERSION)"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (Linux)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Functional suite (Linux)
        run: cargo test --locked

  linux-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Feature lints (hybrid-remote)
        run: cargo clippy --locked --features hybrid-remote --all-targets -- -D warnings
      - name: Feature suite (fixtures only, no network)
        run: cargo test --locked --features hybrid-remote
      - name: ANN fallback survives the release panic strategy (SC-4)
        run: cargo test --release --locked --features hybrid-remote --test hybrid_ann ann_load_failure_falls_back_to_exact -- --exact
      - name: Default build stays offline (NFR-1, SC-1)
        run: |
          if cargo tree --locked -e normal | grep -wE 'fastembed|ort|tokenizers|hf-hub|image|native-tls|ureq|reqwest'; then
            echo "::error::forbidden crate leaked into the default build (NFR-1)"
            exit 1
          fi
          echo "default build has no network/ML crates"

  linux-local:
    # hybrid-local feature build: clippy + full suite, fully offline (no
    # model downloads, no network). Must become a required check (human
    # action; recorded in docs/specs/hybrid-local/progress.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Feature lints (hybrid-local)
        run: cargo clippy --locked --features hybrid-local --all-targets -- -D warnings
      - name: Feature suite (offline; no model downloads)
        run: cargo test --locked --features hybrid-local
      - name: Combined-feature suite (hybrid-local + hybrid-remote; offline)
        run: cargo test --locked --features hybrid-local,hybrid-remote
      - name: Combined-feature lints (hybrid-local + hybrid-remote)
        run: cargo clippy --locked --features hybrid-local,hybrid-remote --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (ADR-10)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: hybrid-local compiles (check-only, no downloads)
        run: cargo check --locked --features hybrid-local --all-targets
      - name: Functional suite (daemon + CLI + MCP, ADR-10)
        run: cargo test --locked

  macos:
    # Advisory until the suite stabilizes on macOS, then a required check
    # (docs/specs/macos-support, FR-7).
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Documented floor (requirements.md): enforce it in the build.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (macOS)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: hybrid-local compiles (check-only, no downloads)
        run: cargo check --locked --features hybrid-local --all-targets
      - name: Functional suite (macOS, aarch64)
        run: cargo test --locked
