name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins nightly for local development; CI validates the
  # MSRV toolchain explicitly (the env var overrides the file).
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene (README/docs/installers/version)
        run: |
          set -e
          test -f README.md
          test -f README.ru.md
          test -f CHANGELOG.md
          test -f install.sh
          test -f install.ps1
          test -f docs/INSTALL.md
          test -f docs/QUICKSTART.md
          test -f docs/CONFIG.md
          test -f docs/MCP.md
          test -f docs/ARCHITECTURE.md
          sh -n install.sh
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          grep -q "\[$VERSION\]" CHANGELOG.md || (echo "::error::CHANGELOG.md has no [$VERSION] entry" && exit 1)
          grep -q 'README.ru.md' README.md
          grep -q 'README.md' README.ru.md
          echo "docs gate OK (version $VERSION)"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (Linux)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Functional suite (Linux)
        run: cargo test --locked

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (ADR-10)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Functional suite (daemon + CLI + MCP, ADR-10)
        run: cargo test --locked
