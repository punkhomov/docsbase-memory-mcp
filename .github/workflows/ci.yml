name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins nightly for local development; CI validates the
  # MSRV toolchain explicitly (the env var overrides the file).
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Repo hygiene (README/docs/installers/version)
        run: |
          set -e
          test -f README.md
          test -f README.ru.md
          test -f CHANGELOG.md
          test -f install.sh
          test -f install.ps1
          test -f docs/INSTALL.md
          test -f docs/QUICKSTART.md
          test -f docs/CONFIG.md
          test -f docs/MCP.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ci.md
          sh -n install.sh
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          grep -q "\[$VERSION\]" CHANGELOG.md || (echo "::error::CHANGELOG.md has no [$VERSION] entry" && exit 1)
          grep -q 'README.ru.md' README.md
          grep -q 'README.md' README.ru.md
          echo "docs gate OK (version $VERSION)"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCSBASE_BENCH_LATENCY_SLACK: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (Linux)
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
      - name: Functional suite (Linux)
        run: cargo test --locked --features cli-full

      - name: Full CLI provider capabilities (offline)
        run: python3 .github/scripts/check-cli-capabilities.py target/debug/docsbase

  linux-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI runners are shared VMs and ~2-2.5x slower than the host that
      # calibrated baseline.json (measured 2026-10-29: same gate test 6.5 s
      # locally vs 12.5-13 s here; Rrf p95 13.16 ms baseline vs 26.7-33.0 ms).
      # The factor scales only the RELATIVE part of the latency budget
      # (baseline x 1.5 x slack + 5 ms); the absolute 500 ms ceiling stays.
      DOCSBASE_BENCH_LATENCY_SLACK: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Feature lints (hybrid-remote)
        run: cargo clippy --locked --features hybrid-remote --all-targets -- -D warnings
      # The remote-only runtime paths are also exercised by the native CLI
      # suites; what only a single-feature build can prove is that the
      # crate compiles and links with `hybrid-local` absent, plus the
      # feature-admission assertions. Rationale: docs/ci.md.
      - name: Feature-sensitive tests (hybrid-remote only)
        run: |
          cargo test --locked --features hybrid-remote --test hybrid_config \
            --test config --test hybrid_openrouter
      - name: Default build stays offline (NFR-1, SC-1)
        run: |
          if cargo tree --locked -e normal | grep -wE 'fastembed|ort|tokenizers|hf-hub|image|native-tls|ureq|reqwest'; then
            echo "::error::forbidden crate leaked into the default build (NFR-1)"
            exit 1
          fi
          echo "default build has no network/ML crates"

  linux-local:
    # Lean/source-build compatibility. Native jobs exercise the shipped CLI.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI runners are shared VMs and ~2-2.5x slower than the host that
      # calibrated baseline.json (measured 2026-10-29: same gate test 6.5 s
      # locally vs 12.5-13 s here; Rrf p95 13.16 ms baseline vs 26.7-33.0 ms).
      # The factor scales only the RELATIVE part of the latency budget
      # (baseline x 1.5 x slack + 5 ms); the absolute 500 ms ceiling stays.
      DOCSBASE_BENCH_LATENCY_SLACK: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Feature lints (hybrid-local)
        run: cargo clippy --locked --features hybrid-local --all-targets -- -D warnings
      # Compile matrix for the feature axis: every 1- and 2-feature
      # combination, all targets. Catches "compiles only with exactly these
      # two features on" without a 2^n x OS test matrix (docs/ci.md).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Feature matrix compiles (powerset, depth 2)
        run: cargo hack check --locked --feature-powerset --depth 2 --exclude-features cli-full --all-targets
      # Keep assertions that only a build without the other feature can make.
      - name: Feature-sensitive tests (hybrid-local only; offline)
        run: |
          cargo test --locked --features hybrid-local --test cli_models \
            --test hybrid_config --test hybrid_local --test hybrid_models --test connect
      - name: Lean Cargo compatibility suite (offline)
        run: cargo test --locked
      - name: Combined-feature lints (hybrid-local + hybrid-remote)
        run: cargo clippy --locked --features hybrid-local,hybrid-remote --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (ADR-10)
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
      - name: Functional suite (daemon + CLI + MCP, ADR-10)
        run: cargo test --locked --features cli-full

      - name: Full CLI provider capabilities (offline)
        run: python .github/scripts/check-cli-capabilities.py target/debug/docsbase.exe

  macos:
    # Native shipped CLI profile (macOS aarch64).
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Documented floor (requirements.md): enforce it in the build.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (macOS)
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
      - name: Functional suite (macOS, aarch64)
        run: cargo test --locked --features cli-full
      - name: Full CLI provider capabilities (offline)
        run: python3 .github/scripts/check-cli-capabilities.py target/debug/docsbase
