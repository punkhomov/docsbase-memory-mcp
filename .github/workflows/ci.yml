name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins nightly for local development; CI validates the
  # MSRV toolchain explicitly (the env var overrides the file).
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (Linux)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Functional suite (Linux)
        run: cargo test --locked

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints (ADR-10)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Functional suite (daemon + CLI + MCP, ADR-10)
        run: cargo test --locked
