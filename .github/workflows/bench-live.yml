# Weekly + manual live benchmark Run (search-benchmark T13/T14).
#
# Advisory only: NEVER a required check, NEVER gating merge — but it must fail
# loudly when it measures nothing (no key, no report), see issue #63. The live run
# exercises real provider models (free tier by default) and uploads the
# report as an artifact for release review. Offline per-PR CI stays the
# enforcement point (DELTA-3: red gate = red `linux` check, human override on red).
name: bench-live

on:
  schedule:
    # Weekly, Monday 06:00 UTC — after the OpenRouter free-tier daily reset.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Require the API key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY is not set for this repository; without it the live measurement prints SKIP and measures nothing"
            exit 1
          fi
      - name: Live measurement (free tier, cost-capped)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Must stay well under the free daily cap (1000 req/day) and the
          # provider's ~20 requests/minute. A full run issues ~580 live calls at
          # 4 s pacing (~40 min): ~193 query embeddings (the two dense configs
          # share the query cache) plus ~386 rerank calls, which cannot be shared.
          DOCSBASE_BENCH_COST_CAP_USD: "2"
        run: >
          cargo test --locked --features hybrid-remote
          --test search_bench_live -- --ignored live_measurement --nocapture
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: target/search-bench/live-report.json
          # A run that produces no report measured nothing: fail instead of
          # uploading silence (issue #63).
          if-no-files-found: error
