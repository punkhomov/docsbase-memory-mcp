name: Windows library full composition diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_BUILD_JOBS: "4"
jobs:
  windows-composition:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Record exact production source (not required CI acceptance)
        shell: python
        run: |
          import json, pathlib, subprocess
          parent = subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()
          head = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          paths = subprocess.check_output(['git','diff','--name-only',parent,head]).decode().splitlines()
          assert paths == ['.github/workflows/ann-investigation.yml'], paths
          directory = pathlib.Path('target/ci-observations')
          directory.mkdir(parents=True, exist_ok=True)
          proof = dict(production_source=parent, validation_head=head,
                       scope='diagnostic composition; required audit unchanged and blocked by issue166')
          print(json.dumps(proof,indent=2))
          pathlib.Path('native-composition-source.json').write_text(json.dumps(proof,indent=2))
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Prepare Web assets and Node IPC client
        shell: bash
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          # Diagnostic native composition only; mandatory audit166 stays blocking.
          pnpm --dir web format:check
          pnpm --dir web check
          pnpm --dir web test:unit
          pnpm --dir web build
          pnpm --dir packages/client format:check
          pnpm --dir packages/client build
          pnpm --dir packages/client check
          pnpm --dir packages/client test
          pnpm --dir examples/website-search format:check
          pnpm --dir examples/website-search check
          pnpm --dir examples/website-search build
          pnpm --dir examples/website-search test
          client_pack="$RUNNER_TEMP/docsbase-client-package"
          mkdir -p "$client_pack"
          pnpm --dir packages/client pack --pack-destination "$client_pack"
          python3 .github/scripts/check-node-package.py "$client_pack"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: windows-library-cli-full-v1
          cache-on-failure: true
      - name: Initialize test diagnostics
        shell: bash
        run: |
          # Never publish observations restored from an earlier cache entry.
          rm -rf target/ci-observations target/cargo-timings
          echo "CI_RUST_CACHE_HIT=${{ steps.rust-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
      - name: Lints (ADR-10)
        run: |
          cargo fmt --check
          cargo clippy --locked --features cli-full --all-targets -- -D warnings
      - name: Prepare functional suite (Windows)
        run: python .github/scripts/observe-tests.py --suite cli-full --phase prepare -- cargo test --locked --features cli-full --no-run --timings
      - name: Inventory functional suite (Windows)
        run: python .github/scripts/observe-tests.py --suite cli-full --phase inventory -- cargo test --locked --features cli-full -- --list
      - name: Functional suite (daemon + CLI + MCP, ADR-10)
        run: python .github/scripts/observe-tests.py --suite cli-full --phase execute -- cargo test --locked --features cli-full

      - name: Full CLI provider capabilities (offline)
        run: python .github/scripts/check-cli-capabilities.py target/debug/docsbase.exe
      - name: Embedded Web artifact smoke
        run: python .github/scripts/check-web-artifact.py target/debug/docsbase.exe
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            native-composition-source.json
            target/ci-observations/
            target/cargo-timings/
