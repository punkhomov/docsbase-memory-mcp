name: Throwaway Mio retirement experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mio-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: experiments/windows-mio-retirement
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Prepare verified locked library sources
        run: python prepare.py
      - name: Native sensitivity and retirement probe
        run: python run.py
      - name: Preserve exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mio-retirement-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: experiments/windows-mio-retirement/evidence/
