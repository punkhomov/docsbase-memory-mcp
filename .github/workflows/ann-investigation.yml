name: Installer copy investigation (temporary branch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-install-copy:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Prepare copied-launcher probe
        run: |
          rm -rf target/ci-observations
          cargo test --locked --features cli-full --test install_copy_probe --no-run
      - name: Compare copied-launcher lifecycles
        run: cargo test --locked --features cli-full --test install_copy_probe -- --ignored --nocapture
      - name: Preserve logs and any failing graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-copy-macos-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: target/ci-observations/
