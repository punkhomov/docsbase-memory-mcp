name: ANN recall investigation

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Maximum full ann_recall executions (1-50; stop on first failure)"
        type: number
        default: 20
        required: true

permissions:
  contents: read

jobs:
  macos-ann:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CARGO_TERM_COLOR: never
      ANN_TRIALS: ${{ inputs.trials }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare embedded Web assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run check --prefix web
          npm run test:unit --prefix web
          npm run build --prefix web
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Prepare unchanged native recall suite
        run: |
          rm -rf target/ci-observations
          cargo test --locked --features cli-full --test ann_recall --no-run
      - name: Observe repeated builds; fail on first failed suite
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          trials = int(os.environ["ANN_TRIALS"])
          if not 1 <= trials <= 50:
              raise SystemExit("trials must be an integer in 1..50")
          output = Path("target/ci-observations/ann-stress")
          output.mkdir(parents=True, exist_ok=True)
          for trial in range(1, trials + 1):
              log = output / f"trial-{trial:02}.log"
              print(f"ANN recall trial {trial}/{trials}", flush=True)
              with log.open("w") as stream:
                  result = subprocess.run(
                      ["cargo", "test", "--locked", "--features", "cli-full",
                       "--test", "ann_recall", "--", "--nocapture"],
                      stdout=stream, stderr=subprocess.STDOUT,
                  )
              print(log.read_text(), flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY
      - name: Preserve logs and any failing graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ann-recall-macos-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: target/ci-observations/
