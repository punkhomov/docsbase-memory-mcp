name: PR 164 review regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "6"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: pr164-review-regression
          cache-on-failure: true
      - name: Exercise all lean native library tests including review regressions
        run: cargo test --locked --lib -- --test-threads=4
