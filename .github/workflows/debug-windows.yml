name: debug-windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.88.0"
  DOCSBASE_IPC_DEBUG: "1"

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: EOF session test with IPC tracing
        run: cargo test --locked --test ipc_server eof_removes_session -- --nocapture
