name: release

# Serious-project release pipeline (constitution §Supply-chain):
# tag v* -> version check -> linux + windows builds -> SBOM ->
# GitHub Release (prerelease for alpha/beta/rc) -> SLSA provenance.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins nightly for local development; CI builds the
  # MSRV toolchain explicitly (the env var overrides the file).
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "Cargo.toml version: $VERSION"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "Git tag version: $TAG"
            if [[ "$VERSION" != "$TAG" ]]; then
              echo "::error::tag v$TAG != Cargo.toml version $VERSION (constitution: must match)"
              exit 1
            fi
          else
            echo "manual run: skipping tag equality (Cargo version $VERSION)"
          fi

  linux:
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build static binary (NFR-6, ADR-8)
        run: cargo release-static --locked
      - name: Platform seam invariant (ADR-9)
        run: cargo test --locked --test platform_boundary
      - name: Artifact checks (NFR-2, NFR-6)
        run: |
          cargo test --locked --test artifact
          ldd target/x86_64-unknown-linux-gnu/release/docsbase
          stat -c%s target/x86_64-unknown-linux-gnu/release/docsbase
      - name: Package + checksum
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          STAGE="dist/linux"
          mkdir -p "$STAGE"
          cp target/x86_64-unknown-linux-gnu/release/docsbase "$STAGE/docsbase"
          tar -czf "$STAGE/docsbase-$VERSION-linux-x86_64.tar.gz" -C "$STAGE" docsbase
          (cd "$STAGE" && sha256sum "docsbase-$VERSION-linux-x86_64.tar.gz" > "docsbase-$VERSION-linux-x86_64.tar.gz.sha256")
          ls -la "$STAGE"
      - name: Attest linux artifact (SLSA provenance, Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/linux/docsbase-*.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: docsbase-linux-x86_64
          path: |
            dist/linux/docsbase-*.tar.gz
            dist/linux/docsbase-*.tar.gz.sha256
          if-no-files-found: error

  windows:
    needs: version-check
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (ADR-10)
        run: cargo build --release --locked
      - name: Platform seam invariant (ADR-9)
        run: cargo test --locked --test platform_boundary
      - name: Smoke the exe
        run: .\target\release\docsbase.exe --help
      - name: Package + checksum
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line.Split('"')[1]
          $stage = "dist/windows"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/docsbase.exe (Join-Path $stage "docsbase.exe")
          $zip = Join-Path $stage "docsbase-$version-windows-x86_64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage "docsbase.exe") -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  docsbase-$version-windows-x86_64.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          Get-ChildItem $stage
      - name: Attest windows artifact (SLSA provenance, Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/windows/docsbase-*.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: docsbase-windows-x86_64
          path: |
            dist/windows/docsbase-*.zip
            dist/windows/docsbase-*.zip.sha256
          if-no-files-found: error

  sbom:
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: docsbase.sbom.spdx.json
      - name: Rename per version + checksum
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p dist/sbom
          mv docsbase.sbom.spdx.json "dist/sbom/docsbase-$VERSION.sbom.spdx.json"
          # Drop the action's default-named leftover so only versioned files ship.
          rm -f ./*.spdx.json
          (cd dist/sbom && sha256sum "docsbase-$VERSION.sbom.spdx.json" > "docsbase-$VERSION.sbom.spdx.json.sha256")
          # Belt and suspenders: keep only the versioned pair in the stage dir.
          find dist/sbom -type f ! -name "docsbase-$VERSION*" -delete
          ls -la dist/sbom
      - name: Attest SBOM
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/sbom/docsbase-*.spdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: docsbase-sbom
          path: |
            dist/sbom/docsbase-*.spdx.json
            dist/sbom/docsbase-*.spdx.json.sha256
          if-no-files-found: error

  publish:
    needs: [linux, windows, sbom]
    # Publish only on tag pushes; manual runs stop at artifacts.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist/artifacts
      - name: Stage release files
        run: |
          mkdir -p dist/release
          find dist/artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.spdx.json' \) -exec cp {} dist/release/ \;
          ls -la dist/release
          # .sha256 files hold bare filenames: verify from inside the dir.
          (cd dist/release && sha256sum -c -- *.sha256)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
          # Alpha/beta/rc tags are marked as prereleases automatically.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          fail_on_unmatched_files: true
