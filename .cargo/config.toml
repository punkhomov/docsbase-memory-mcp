[registry]
# TODO(cargo-1.100): when min-publish-age stabilizes, add a CI job that
# enforces it (stable ignores this key today) — see docs/supply-chain.md.
# TEMPORARY 2026-10-22: 13 days to resolve hnsw_rs 0.3.5 for ann-index.
# Cargo 1.101 nightly has no declarative per-package min-publish-age exception.
# Revert to "14 days" on 2026-10-23 (task T1.5); see ann-index/progress.md.
global-min-publish-age = "13 days"

[resolver]
incompatible-publish-age = "deny"

# NFR-6: one static binary for Linux/WSL2 (ADR-8). Target-scoped rustflags are
# only picked up for real cross/multi-target builds (`--target ...` or the
# `release-static` alias); plain host builds stay dynamic so proc-macros keep
# working. musl is not used: its C cross toolchain is unavailable for the
# bundled C sources (SQLite, zstd).
[alias]
release-static = [
    "build",
    "--release",
    "--target",
    "x86_64-unknown-linux-gnu",
    "--config",
    "target.x86_64-unknown-linux-gnu.rustflags=[\"-C\", \"target-feature=+crt-static\"]",
]
