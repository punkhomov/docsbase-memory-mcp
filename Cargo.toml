[package]
name = "docsbase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first documentation memory MCP server for coding agents"
license = "MIT"

[lib]
name = "docsbase_memory"
path = "src/lib.rs"

[[bin]]
name = "docsbase"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
toml = "1.1.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
tempfile = "3.27.0"
