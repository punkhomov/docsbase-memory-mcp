[package]
name = "docsbase"
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.88"
description = "Local-first documentation memory MCP server for coding agents"
license = "MIT"

[lib]
name = "docsbase_memory"
path = "src/lib.rs"

[[bin]]
name = "docsbase"
path = "src/main.rs"

[features]
default = []
# OpenRouter embeddings + rerank (spec docs/specs/hybrid-providers, ADR-14).
# The default build stays fully offline: no network crates, no reqwest.
hybrid-remote = ["dep:reqwest"]
# Local fastembed provider (spec docs/specs/hybrid-local, ADR-17): model
# registry/cache, ORT runtime install, fastembed embed/rerank. Everything is
# optional and pinned exactly (supply-chain cooldown, docs/supply-chain.md);
# the default build links none of it (NFR-1).
hybrid-local = [
    "dep:fastembed",
    "dep:ort",
    "dep:ureq",
    "dep:sha2",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
fd-lock = "4.0.4"
hnsw_rs = "=0.3.5"
ignore = "0.4.30"
notify = "8.2.0"
ouroboros = "0.18.5"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"], optional = true }
# hybrid-local (ADR-17): exact pins per design §2; fastembed defaults are all
# off (no download-binaries / hf-hub / image / native-tls). `ort` is a direct
# load-dynamic dependency so `init_from` can load an explicitly installed ORT.
fastembed = { version = "=7.1.1", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"], optional = true }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
flate2 = { version = "=1.1.10", optional = true }
tar = { version = "=0.4.46", optional = true }
zip = { version = "=8.6.0", optional = true }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "transport-async-rw"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.26"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "time", "signal", "io-util", "sync", "macros"] }
toml = "1.1.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
insta = { version = "1.48.0", features = ["json"] }
tempfile = "3.27.0"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "vector_cache"
harness = false

[target."cfg(unix)".dependencies]
# statvfs for the free-space preflight (FR-13); already transitive on macOS,
# now explicit for all Unix.
libc = "0.2"

[target."cfg(windows)".dependencies]
interprocess = { version = "2.4.4", features = ["tokio"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
# ADR-M1: macOS liveness/counters via proc_pidinfo. Already in the dependency
# graph transitively (notify -> fsevent-sys), so this adds no new crate.
libc = "0.2"
