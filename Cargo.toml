[package]
name = "docsbase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first documentation memory MCP server for coding agents"
license = "MIT"

[lib]
name = "docsbase_memory"
path = "src/lib.rs"

[[bin]]
name = "docsbase"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
fd-lock = "4.0.4"
ignore = "0.4.30"
pulldown-cmark = "0.13.4"
rmcp = { version = "2.2.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.25.0"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "time", "signal", "io-util", "sync", "macros"] }
toml = "1.1.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
