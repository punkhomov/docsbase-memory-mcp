[package]
name = "docsbase"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Local-first documentation memory MCP server for coding agents"
license = "MIT"

[lib]
name = "docsbase_memory"
path = "src/lib.rs"

[[bin]]
name = "docsbase"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
fd-lock = "4.0.4"
ignore = "0.4.30"
notify = "8.2.0"
pulldown-cmark = "0.13.4"
rmcp = { version = "3", default-features = false, features = ["server", "transport-io", "transport-async-rw"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.26"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "time", "signal", "io-util", "sync", "macros"] }
toml = "1.1.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
insta = { version = "1.48.0", features = ["json"] }
tempfile = "3.27.0"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "vector_cache"
harness = false

[target."cfg(windows)".dependencies]
interprocess = { version = "2.4.4", features = ["tokio"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }
