[package]
name = "docsbase-mio-retirement-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security"] }

[patch.crates-io]
mio = { path = "vendor/mio" }
tokio = { path = "vendor/tokio" }
