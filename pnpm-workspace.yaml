packages:
  - web
  - packages/*
  - examples/website-search

# Enforced for the whole graph, including frozen-lockfile installs.
minimumReleaseAge: 20160 # 14 days, in minutes
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true

# New install scripts require a reviewed allow/deny decision. None may run.
strictDepBuilds: true
allowBuilds:
  esbuild: false
  '@tailwindcss/oxide': false
  shadcn-svelte: false
skills:
  dirs: []

autoInstallPeers: false
strictPeerDependencies: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
saveExact: true

# Human-approved temporary dev-tooling risk acceptance (2026-11-18, #166).
# picomatch@4.0.7 via Vite/Svelte only; remove when an eligible fix is available.
audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf
